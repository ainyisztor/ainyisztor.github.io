<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video dashboard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="robots" content="noindex">
<title>Video feldolgozó dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Elrendezés: fix állapotsáv felül (lámpa + frissesség), alatta előbb ami a te figyelmed kéri (piros, sárga),
   aztán a futó munka és a haladás; legalul összecsukva a megoldott problémák tudástára. iPaden két oszlop. */
:root{
  --alap:#EEF1F4; --lap:#FFFFFF; --lap2:#F6F8FA; --vonal:#D9DFE5;
  --tinta:#121A22; --halk:#4F5D6B;           /* kiegészítő szöveg: 4.5:1 felett mindkét témában */
  --fut:#1D6FB8; --fut-h:#E3EEF8;            /* haladás: jégkék, nem jelzőszín */
  --piros:#B42318; --piros-h:#FDECEA;
  --sarga:#9A6700; --sarga-h:#FFF4D6;
  --zold:#1E7B4A; --zold-h:#E6F4EC;
  --display:"Barlow Condensed",system-ui,sans-serif;
  --szoveg:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --alap:#0E1418; --lap:#172028; --lap2:#1D2731; --vonal:#2C3843;
  --tinta:#EEF2F5; --halk:#A9B6C2;
  --fut:#5FA8EA; --fut-h:#1A2C3D;
  --piros:#FF7B6E; --piros-h:#3A1E1B;
  --sarga:#F2BE4A; --sarga-h:#352A12;
  --zold:#5CCB8E; --zold-h:#16301F; color-scheme:dark }}
:root[data-theme="dark"]{
  --alap:#0E1418; --lap:#172028; --lap2:#1D2731; --vonal:#2C3843;
  --tinta:#EEF2F5; --halk:#A9B6C2;
  --fut:#5FA8EA; --fut-h:#1A2C3D;
  --piros:#FF7B6E; --piros-h:#3A1E1B;
  --sarga:#F2BE4A; --sarga-h:#352A12;
  --zold:#5CCB8E; --zold-h:#16301F; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--alap);color:var(--tinta);font:400 17px/1.45 var(--szoveg)}
button,textarea{font:inherit}
.num{font-variant-numeric:tabular-nums}
.halk{color:var(--halk)} .kicsi{font-size:14px;line-height:1.4}

/* ===== felső állapotsáv ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lap)}
.fej{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--lap);border-bottom:1px solid var(--vonal)}
.fej-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lampa{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.lampa svg{width:22px;height:22px}
.lampa.piros{background:var(--piros)} .lampa.sarga{background:var(--sarga)} .lampa.zold{background:var(--zold)} .lampa.szurke{background:var(--halk)}
.fej-szoveg{min-width:0;flex:1}
.fej-cim{font:700 22px/1.1 var(--display);letter-spacing:.01em}
.fej-al{font-size:14px;color:var(--halk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fej-al b{color:var(--tinta);font-weight:600}
.gomb{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--vonal);background:var(--lap);color:var(--tinta);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.gomb:hover{background:var(--lap2)}
.gomb.fo{background:var(--fut);border-color:var(--fut);color:#fff}
.gomb.veszely{color:var(--piros);border-color:var(--piros)}
.gomb.megerosit{background:var(--piros);border-color:var(--piros);color:#fff}
.gomb[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--fut);outline-offset:2px}

.oldal{max-width:1180px;margin:0 auto;display:grid;gap:22px;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.osszegzes{font:600 19px/1.35 var(--szoveg)}
.jelek{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--halk)}
.jelek span{display:inline-flex;align-items:center;gap:6px}
.racs{display:grid;gap:22px}
@media (min-width:900px){.racs{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}}
.oszlop{display:grid;gap:22px;min-width:0}
.blokk{display:grid;gap:10px;min-width:0}
h2{margin:0;font:700 24px/1.15 var(--display);letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
h2 .db{font:600 15px/1 var(--szoveg);color:var(--halk)}

/* ===== kártya: egy forma minden állapotra ===== */
.kartya{background:var(--lap);border:1px solid var(--vonal);border-left:6px solid var(--vonal);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.kartya.piros{border-left-color:var(--piros)} .kartya.sarga{border-left-color:var(--sarga)} .kartya.zold{border-left-color:var(--zold)}
.k-fej{display:flex;gap:10px;align-items:flex-start}
.ikon{flex:none;width:22px;height:22px;margin-top:2px}
.piros .ikon{color:var(--piros)} .sarga .ikon{color:var(--sarga)} .zold .ikon{color:var(--zold)}
.k-cim{font-weight:600;font-size:18px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.k-ido{font-size:14px;color:var(--halk)}
.k-reszlet{font-size:15px;color:var(--halk);overflow-wrap:anywhere}
.lepesek{display:grid;gap:6px;background:var(--lap2);border-radius:8px;padding:10px 12px;font-size:15px}
.lepesek b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--halk);font-weight:600}
.k-gombok{display:flex;flex-wrap:wrap;gap:8px}
.cimke{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--lap2);color:var(--halk)}
.cimke.piros{background:var(--piros-h);color:var(--piros)} .cimke.sarga{background:var(--sarga-h);color:var(--sarga)} .cimke.zold{background:var(--zold-h);color:var(--zold)}
.vissza{font-size:14px;color:var(--halk)}

/* döntés */
.dontes{background:var(--piros-h);border:1px solid var(--piros);border-left-width:6px}
.dontes textarea{width:100%;min-height:64px;border-radius:8px;border:1px solid var(--vonal);background:var(--lap);color:var(--tinta);padding:8px 10px;font-size:16px;resize:vertical}
.dontes .gomb.fo{background:var(--piros);border-color:var(--piros)}
.dontes .k-reszlet{white-space:pre-line}

/* futó sorok */
.sor{background:var(--lap);border:1px solid var(--vonal);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.sor-fej{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sor-nev{font-size:14px;color:var(--halk);font-weight:600;letter-spacing:.02em}
.sor-mi{font:600 19px/1.25 var(--szoveg);overflow-wrap:anywhere}
.csik{height:10px;border-radius:6px;background:var(--fut-h);overflow:hidden}
.csik i{display:block;height:100%;background:var(--fut);border-radius:6px}
.csik.all i{background:var(--sarga)}
@media (prefers-reduced-motion:no-preference){.csik i{transition:width .6s ease}}
.sor-adat{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--halk)}
.sor-adat b{color:var(--tinta);font-weight:600}
details>summary{cursor:pointer;list-style:none;color:var(--fut);font-weight:600;font-size:15px;min-height:32px;display:flex;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";width:18px;display:inline-block}
details[open]>summary::before{content:"−"}
.lista{display:grid;gap:0;margin:0;padding:0;list-style:none}
.lista li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--vonal);font-size:15px;min-width:0}
.lista li:first-child{border-top:0}
.lista .n{min-width:0;overflow-wrap:anywhere}
.gomb.kis{min-height:36px;padding:0 12px;font-size:14px}

/* haladás */
.proj{background:var(--lap);border:1px solid var(--vonal);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.proj-fej{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.proj-fej h3{margin:0;font:700 20px/1.2 var(--display)}
.proj-pct{font:700 28px/1 var(--display)}
.csop{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.csop .csik{grid-column:1/-1;height:6px}

/* kész filmek, gép */
.vid{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--vonal);font-size:15px}
.vid:first-child{border-top:0}
.vid .h{font-variant-numeric:tabular-nums;font-weight:600}
.vid .m{grid-column:1/-1;font-size:14px;color:var(--halk)}
.panel{background:var(--lap);border:1px solid var(--vonal);border-radius:var(--r);padding:12px 16px;min-width:0}
.gep{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.gep b{font-weight:600}
.lemez{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15px;margin-top:10px}
.lemez .csik{grid-column:1/-1;height:6px}
/* tárhely – helyőr (v25) */
.tl{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--vonal);min-width:0}
.tl:first-of-type{border-top:0;padding-top:4px}
.tl-fej{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.tl-nev{font-weight:600;min-width:0;overflow-wrap:anywhere} .tl-nev small{font-weight:400;color:var(--halk);font-size:14px}
.tl-szam{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap} .tl-szam small{font:600 14px/1 var(--szoveg);color:var(--halk);margin-left:3px}
.tsav{position:relative;height:12px;border-radius:6px;background:var(--fut-h);margin:2px 0}
.tsav i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--fut)}
.tsav.sarga i{background:var(--sarga)} .tsav.piros i,.tsav.fek i{background:var(--piros)}
.tsav .jel{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;box-shadow:0 0 0 1px var(--lap)}
.jel.s{background:var(--sarga)} .jel.p{background:var(--piros)} .jel.f{background:var(--tinta)}
.tl-adat{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--halk)}
.tl-adat b{color:var(--tinta);font-weight:600}
.tar-allapot{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding-bottom:10px;border-bottom:1px solid var(--vonal);margin-bottom:4px}
.tar-allapot .ikon{flex:none;width:20px;height:20px;margin-top:1px}
.munka{background:var(--lap2);border-radius:8px;padding:10px 12px;font-size:15px;display:grid;gap:4px;margin-top:8px;overflow-wrap:anywhere}
.munka b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--halk);font-weight:600}
.jelmagy{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--halk);margin-top:8px}
.jelmagy i{display:inline-block;width:3px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
/* levelek (v28) */
.lv{border-top:1px solid var(--vonal)} .lv:first-child{border-top:0}
.lv>summary{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;min-height:44px;color:var(--tinta);font-weight:400}
.lv>summary::before{display:none}
.lv .t{min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:15px}
.lv .i{font-size:13px;color:var(--halk);white-space:nowrap;text-align:right}
.lv .r{grid-column:2/-1;font-size:13px;color:var(--halk);margin-top:-2px}
.lv-tetel{margin:0 0 10px 0;padding:8px 10px;border-left:4px solid var(--vonal);background:var(--lap2);border-radius:0 8px 8px 0;font-size:14px;overflow-wrap:anywhere}
.lv-tetel.piros{border-left-color:var(--piros)} .lv-tetel.sarga{border-left-color:var(--sarga)} .lv-tetel.zold{border-left-color:var(--zold)}
.lv-tetel b{display:block;font-size:15px}
.lv-tetel .m{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:6px;background:var(--sarga-h)}
.lv-nap{font-size:13px;font-weight:700;color:var(--halk);text-transform:uppercase;letter-spacing:.04em;padding:12px 0 2px}
/* youtube (v26) */
.yt-lista{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--vonal);min-width:0}
.yt-lista:first-of-type{border-top:0;padding-top:4px}
.yt-fej{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.yt-nev{font-weight:600;min-width:0;overflow-wrap:anywhere}
.yt-db{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap} .yt-db small{font:600 14px/1 var(--szoveg);color:var(--halk);margin-left:3px}
.yt-sav{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--lap2)}
.yt-sav i{display:block;height:100%}
.yt-sav .k{background:var(--zold)} .yt-sav .f{background:var(--fut)} .yt-sav .p{background:var(--sarga)} .yt-sav .h{background:var(--piros)}
.yt-osszeg{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--halk)}
.yt-osszeg b{color:var(--tinta);font-weight:600}
.yt-vid{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--vonal);font-size:15px;min-width:0}
.yt-vid:first-child{border-top:0}
.yt-vid .c{min-width:0;overflow-wrap:anywhere}
.yt-vid .m{grid-column:1/-1;font-size:13px;color:var(--halk)}
.yt-vid .csik{grid-column:1/-1;height:6px}
.cimke.fut{background:var(--fut-h);color:var(--fut)}
a.gomb{text-decoration:none}
.uzenet textarea{width:100%;min-height:84px;border-radius:8px;border:1px solid var(--vonal);background:var(--lap);color:var(--tinta);padding:10px 12px;font-size:16px;resize:vertical}
.uzenet .k-gombok{margin-top:8px;justify-content:space-between;align-items:center}

/* tudástár */
.tudas{display:grid;gap:10px}
@media (min-width:900px){.tudas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tudas .kartya{background:var(--lap)}
.sorok3{display:grid;gap:6px;font-size:15px}
.sorok3 b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--halk);font-weight:600;display:block}

.uzen{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--tinta);color:var(--lap);padding:12px 18px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px)}
.kulcs{background:var(--lap);border:1px solid var(--vonal);border-radius:var(--r);padding:16px;display:grid;gap:10px;max-width:520px}
.kulcs input{min-height:44px;border-radius:8px;border:1px solid var(--vonal);padding:0 12px;font-size:16px;background:var(--lap);color:var(--tinta)}
.ures{color:var(--halk);font-size:15px}
.vaz{height:96px;border-radius:var(--r);background:var(--lap);border:1px solid var(--vonal)}
</style>
</head>
<body>
<header class="fej"><div class="fej-in">
  <div class="lampa szurke" id="lampa" aria-hidden="true"></div>
  <div class="fej-szoveg"><div class="fej-cim">Video feldolgozó</div><div class="fej-al" id="frissesseg">Betöltés…</div></div>
  <button class="gomb" type="button" id="frissit" aria-label="Frissítés most">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Frissítés</button>
</div></header>
<main class="oldal" id="app">
  <div class="vaz"></div><div class="vaz"></div><div class="vaz"></div>
</main>
<div class="uzen" id="uzen" hidden></div>
<script>
// ===== Video feldolgozó dashboard v28 (okt. 23.: kiküldött levelek; v27: YouTube – a gép maga tölt fel, Mehet-kártya, egyszeri engedély; v26: YouTube-feltöltés panel; v25: Tárhely – helyőr panel; v23 okt. 22.: piros–sárga–zöld, „Ezt fogom tenni / Hol járok”, tudástár, beavatkozás) =====
// Két helyen fut ugyanez az oldal: (1) a Google Apps Script webalkalmazásban (google.script.run), (2) önálló tárhelyen
// (pl. GitHub Pages) – ott a „Stelvio fogadó”-tól kéri az adatot a készüléken eltárolt dashboard-kulccsal.
var FOGADO = /\.github\.io$/.test(location.hostname) ? 'https://script.google.com/macros/s/AKfycby7Q96vFrG9B0LGjMWPfC2TBTJ0DVBYXY3yWj0lofNfWifKpB419im_tYRepG709ntM/exec' : '';   // önálló tárhelyen (GitHub Pages) a „Stelvio fogadó”-tól kér
var MINTA = null; /*MINTA*/

var ALAP = {
  nema:'Ha a gép magától visszajön, a futtató 10 percen belül folytatja. Ha 1 órán belül nem jön vissza, távolról nem tudom bekapcsolni: nézd meg, megy-e. Utána az eseménynaplóból kiderítem az okát.',
  ujraind:'Az eseménynaplóból kiderítem az okát (lefagyás, áram, frissítés), és beállítom a megelőzést. A félbemaradt feladatok maguktól újraindulnak.',
  hiba:'A naplóból megkeresem, miért bukott el, kijavítom a kódot vagy a bemenetet, és visszateszem a sorba.',
  hely:'A helyőr a háttérben áthelyezi a régóta nem használt köztes mappákat egy másik lemezre (bitre pontos ellenőrzéssel, a régi helyen csomóponttal – semmit nem kell újra elkészíteni), és üríti a lomtárat. Piros szintnél új nagy lépés nem indul; vészféknél a feldolgozás szünetel, nem sérül. Ha nincs mit áthelyezni, döntést kérek.',
  lemezhiany:'Ha visszajön, a futtató magától folytatja. Ha 10 percen belül nem: nézd meg az USB-kábelt, és dugd vissza. Addig a gépen semmi nem fut, ami ezt a lemezt használja.',
  lemezegeszseg:'Leállítás nélkül megnézem a lemez hibanaplóját; ha romlik, a még egy példányban meglévő anyagot átmásolom egy másik lemezre – előtte szólok.',
  helyornema:'A következő Claude-munkamenet megnézi, fut-e a „Stelvio helyor” ütemezett feladat, és újraindítja. Addig a régi, egyszerű figyelés véd (30 GB alatt új feladat nem indul).',
  memoria:'A memóriaőr 2 perc után leállítja a legutóbb indult nehéz feladatot, és az magától visszakerül a sorba.',
  figyelem:'Átnézem, és ide írom, mit találtam.',
  ell:'Megnézem, a film hibás-e vagy csak az ellenőrzés tévedett, és aszerint javítom. Addig ne töltsd fel sehova.',
  akad:'Megnézem a naplóban, vár-e valamire (zár, memória) vagy elakadt; ha elakadt, megszakítom és újraindítom.',
  korai:'Figyelem; ha rosszabb lesz, beavatkozom, mielőtt baj lenne.',
  ytjova:'Amint jóváhagyod (a YouTube-munkamenetben válaszolj), folytatom a feltöltést.',
  ytengedely:'Ez egyszeri: a Google megkérdezi, feltölthet-e a gép a csatornádra. Utána nincs vele dolgod, a feltöltés magától megy.',

  if(nyitD.length&&!VENDEG){h+='<section class="blokk" aria-live="polite"><h2>Döntésedre vár <span class="db">'+nyitD.length+'</span></h2>';
    nyitD.forEach(function(x){var id=esc(x.id);
      h+='<article class="kartya dontes" data-dontes="'+id+'"><div class="k-fej">'+IKON.piros.replace('class="ikon"','class="ikon" style="color:var(--piros)"')+'<div style="min-width:0;flex:1"><div class="k-cim">'+esc(x.cim)+'</div>'+(x.szoveg?'<div class="k-reszlet" style="color:var(--tinta)">'+esc(x.szoveg)+'</div>':'')+
        '<div class="k-ido">Vár: '+mikor(x.letrehozva)+' óta</div></div></div>'+
        '<textarea id="m_'+id+'" placeholder="Megjegyzés (nem kötelező) – például mit javítsak"></textarea>'+
        '<div class="k-gombok"><button type="button" class="gomb fo" onclick="dontes(\''+id+'\',\'mehet\')">Mehet</button><button type="button" class="gomb" onclick="dontes(\''+id+'\',\'javitas\')">Javítás kell</button></div>'+
        '<div class="vissza">'+(x.auto?'„Mehet” után a gép magától folytatja.':'„Mehet” után Claude a következő munkamenetben végrehajtja.')+'</div></article>';});
    h+='</section>';}

  var bal='',jobb='';
  // figyelmeztetések
  if(P.length){bal+='<section class="blokk"><h2>Figyelem <span class="db">'+(piros?piros+' piros':'')+(piros&&sarga?' · ':'')+(sarga?sarga+' sárga':'')+'</span></h2>'+P.map(kartya).join('')+'</section>';}

  // most fut
  bal+='<section class="blokk"><h2>Most fut</h2>';
  (a.sorok||[]).forEach(function(s){
    var t=ido(s.halad_frissult),all=s.fut&&!s.var&&t&&(Date.now()-t)>60*60000, pct=Math.max(0,Math.min(100,szam(s.szazalek)||0));
    var kov=(s.kovetkezo||[]).filter(function(k){return k!==s.fut;});
    var cimke=SOR_NEV[s.mappa]||s.nev;
    bal+='<div class="sor"><div class="sor-fej"><span class="sor-nev">'+esc(cimke)+'</span>'+(s.szunetel?'<span class="cimke sarga">szünetel · '+s.szunetel+' feladat vár</span>':'')+'</div>';
    if(s.fut){
      bal+='<div class="sor-mi">'+esc(nev(s.fut))+'</div><div class="csik'+(all?' all':'')+'" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
        '<div class="sor-adat"><span><b class="num">'+pct+'%</b>'+(s.mit?' · '+esc(s.mit):'')+'</span>'+(s.varhato?'<span>kész kb. <b>'+esc(s.varhato)+'</b></span>':'')+
        (s.var?'<span><span class="cimke">vár</span> '+esc(String(s.var).replace(/^várakozás:\s*/,'').replace('egy másik összeállítás fut (zár)','egyszerre csak egy nehéz összeállítás futhat, most egy másik fut'))+'</span>':'')+
        (t&&!s.var?'<span>'+(all?'<b style="color:var(--sarga)">'+tartam((Date.now()-t)/60000)+' óta nem mozdul</b>':'haladás frissült '+mikor(t))+'</span>':'')+(s.vege&&kov.length?'<span>sor vége kb. <b>'+mikor(s.vege)+'</b></span>':'')+'</div>'+
        '<div class="k-gombok">'+gombHTML('Megszakít','megszakit',s.fut,{veszely:1,ketlepes:1})+utasitasAllapot(a,'megszakit',s.fut)+'</div>';
    } else bal+='<div class="ures">'+(kov.length?'Indulásra vár: '+esc(nev(kov[0])):'Üres, nincs feladat.')+'</div>';
    if(kov.length)bal+='<details><summary>Következik ('+kov.length+')</summary><ul class="lista">'+kov.map(function(k,i){return '<li><span class="n">'+(/^0_/.test(k)?'<span class="cimke">előre véve</span> ':'')+esc(nev(k))+'<br>'+utasitasAllapot(a,'elore',k)+'</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+(i>0&&!/^0_/.test(k)?gombHTML('Előre','elore',k,{kis:1}):'')+gombHTML('Félretesz','felre',k,{kis:1,ketlepes:1})+'</span></li>';}).join('')+'</ul></details>';
    if(s.mappa)bal+='<div class="k-gombok">'+(s.szunetel?gombHTML('Folytat','folytat',s.mappa,{kis:1}):((s.fut||kov.length)?gombHTML('Szünet a sorban','szunet',s.mappa,{kis:1,ketlepes:1}):''))+utasitasAllapot(a,s.szunetel?'folytat':'szunet',s.mappa)+'</div>';
    bal+='</div>';
  });
  if((a.felre||[]).length)bal+='<details class="panel"><summary>Félretett feladatok ('+a.felre.length+')</summary><ul class="lista">'+a.felre.map(function(k){return '<li><span class="n">'+esc(nev(k))+'</span>'+gombHTML('Vissza a sorba','vissza',k,{kis:1})+'</li>';}).join('')+'</ul></details>';
  bal+='</section>';

  // haladás
  var terv=a.terv||[];
  if(terv.length){bal+='<section class="blokk"><h2>Haladás</h2>';
    terv.forEach(function(p){var k=0,o=0;(p.csoportok||[]).forEach(function(c){if(c.tetelek&&c.tetelek.length){k+=c.kesz;o+=c.ossz;}});var pct=o?Math.round(k/o*100):0;
      bal+='<div class="proj"><div class="proj-fej"><h3>'+esc(p.nev.replace(' v2',''))+'</h3><span class="proj-pct num">'+pct+'%</span></div><div class="csik"><i style="width:'+pct+'%"></i></div>'+
        '<div class="kicsi halk">'+k+' / '+o+' film kész'+(p.becsult_vege&&k<o?' · becsült befejezés: <b style="color:var(--tinta)">'+mikor(p.becsult_vege)+'</b>':'')+(o&&k>=o?' · minden film kész':'')+'</div>'+
        '<details><summary>Részletek</summary>'+(p.csoportok||[]).map(function(c){var cp=c.ossz?c.kesz/c.ossz*100:0;return '<div class="csop"><span>'+esc(c.nev)+'</span><span class="num">'+c.kesz+' / '+c.ossz+'</span><div class="csik"><i style="width:'+cp+'%"></i></div></div>';}).join('')+'</details></div>';});
    bal+='</section>';}

  // jobb oszlop: üzenet, Claude-ra vár, kész filmek, gép
  var vazlat=tolt('vfd_vazlat')||'';
  if(!VENDEG)jobb+='<section class="blokk uzenet"><h2>Üzenet Claude-nak</h2><div class="panel"><textarea id="uzenet_claude" placeholder="Például: a 05-28-as filmet vedd előre, vagy: nézd meg, miért lassú" oninput="tarol(\'vfd_vazlat\',this.value)">'+esc(vazlat)+'</textarea>'+
    '<div class="k-gombok"><span class="kicsi halk">A következő Claude-munkamenet ezzel kezd.</span><button type="button" class="gomb fo" onclick="uzenetKuld()">Küldés</button></div>'+utasitasAllapot(a,'uzenet','')+'</div></section>';
  var ct=a.claude_teendok||[];
  if(ct.length&&!VENDEG)jobb+='<section class="blokk"><h2>Claude-ra vár <span class="db">'+ct.length+'</span></h2><div class="panel"><ul class="lista">'+ct.map(function(t){return '<li><span class="n"><b>'+esc(t.cim)+'</b>'+(t.megjegyzes?'<br><span class="kicsi halk">„'+esc(t.megjegyzes)+'”</span>':'')+'</span><span class="kicsi halk" style="white-space:nowrap">'+mikor(t.ido)+'</span></li>';}).join('')+'</ul></div></section>';
  jobb=tarhely(a)+youtube(a)+levelek(a)+jobb;
  var kv=(a.kesz_videok||[]).filter(function(v){return v.allapot!=='proba';});
  jobb+='<section class="blokk"><h2>Kész filmek</h2><div class="panel">'+(kv.length?'':'<div class="ures">Még nincs kész film.</div>');
  function vs(v){var ok=(v.allapot||(/^rendben/.test(v.ellenorzes||'')?'rendben':'hiba'))==='rendben';
    return '<div class="vid"><span>'+esc(filmNev(v.fajl))+'</span><span class="h">'+hossz(v.hossz_mp)+'</span><span class="m">'+mikor(v.ido)+' · '+(ok?'<span style="color:var(--zold)">ellenőrizve</span>':'<span style="color:var(--piros)">ellenőrzés hibás</span>')+'</span></div>';}
  jobb+=kv.slice(0,6).map(vs).join('')+(kv.length>6?'<details><summary>Korábbiak ('+(kv.length-6)+')</summary>'+kv.slice(6).map(vs).join('')+'</details>':'')+'</div></section>';
  var m=a.meres||{};
  function gpu(s){var x=String(s||'').match(/^(\d+)\s*\((\d+)C/);return x?x[1]+'% · '+x[2]+' °C':'–';}
  jobb+='<section class="blokk"><h2>A gép</h2><div class="panel"><div class="gep"><span>Processzor <b class="num">'+esc(m.cpu||'–')+'%</b></span><span>Szabad memória <b class="num">'+esc(String(m.memoria_szabad_GB||'–'))+' GB</b></span><span>1. kártya <b class="num">'+gpu(m.gpu0)+'</b></span><span>2. kártya <b class="num">'+gpu(m.gpu1)+'</b></span></div>';
  var ev=(a.esemenyek||[]).slice().reverse();
  if(ev.length)jobb+='<details><summary>Utolsó események</summary><ul class="lista">'+ev.map(function(e){var mi={kesz:'kész',hibas:'elbukott',ujraproba:'átmeneti hiba, újrapróba',leallitas:'leállítás',mehet:'mehet'}[e.mi]||e.mi;return '<li><span class="n">'+esc(nev(e.nev))+' – '+esc(mi)+'</span><span class="kicsi halk" style="white-space:nowrap">'+mikor(e.ido)+'</span></li>';}).join('')+'</ul></details>';
  jobb+='</div></section>';

  h+='<div class="racs"><div class="oszlop">'+bal+'</div><div class="oszlop">'+jobb+'</div></div>';
  var T=tudastar(a);
  h+='<section class="blokk"><details'+(T.length&&!P.length?'':'')+'><summary><h2 style="display:inline-flex">Megoldott problémák – tudástár <span class="db">'+T.length+'</span></h2></summary>'+(T.length>3?'<input id="tudas_kereso" type="search" placeholder="Keresés a megoldott problémák között" oninput="tudasSzur()" style="margin-top:10px;width:100%;min-height:44px;border-radius:8px;border:1px solid var(--vonal);padding:0 12px;font-size:16px;background:var(--lap);color:var(--tinta)">':'')+'<div class="tudas" id="tudas" style="margin-top:10px">'+(T.join('')||'<div class="ures">Még nincs megoldott probléma.</div>')+'</div></details></section>';

  // a nyitott részeket és a begépelt szöveget megtartjuk
  var nyitott=[].map.call(app.querySelectorAll('details'),function(d){return d.open;}), akt=document.activeElement&&document.activeElement.id, ert={};
  app.querySelectorAll('textarea,input').forEach(function(t){if(t.id)ert[t.id]=t.value;});
  app.innerHTML=h;
  app.querySelectorAll('details').forEach(function(d,i){if(nyitott[i])d.open=true;});
  app.querySelectorAll('textarea,input').forEach(function(t){if(t.id&&ert[t.id])t.value=ert[t.id];});
  tudasSzur();
  if(akt&&document.getElementById(akt))document.getElementById(akt).focus();
}

document.getElementById('frissit').addEventListener('click',function(){betolt(true);});
(function(){var s=tolt('vfd_allapot');if(s){try{A=JSON.parse(s);rajzol(A);}catch(e){}}
  if(!GAS()&&!FOGADO&&MINTA){A=MINTA;rajzol(A);}
  betolt();})();
setInterval(function(){if(!(document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)))betolt();},60000);
setInterval(function(){if(A&&!(document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)))rajzol(A);},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)betolt();});
</script>
</body>
</html>
