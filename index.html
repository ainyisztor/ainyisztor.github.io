<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video dashboard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" href="ikon-180.png">
<meta name="robots" content="noindex">
<title>Video feldolgozó dashboard</title>
<style>
:root{--alap:#EEF1F4;--lap:#FFFFFF;--tinta:#121A22;--halk:#4F5D6B;--vonal:#D9DFE5;--fut:#1D6FB8}
@media (prefers-color-scheme: dark){:root{--alap:#0E1418;--lap:#172028;--tinta:#EEF2F5;--halk:#A9B6C2;--vonal:#2C3843;--fut:#5FA8EA;color-scheme:dark}}
body{margin:0;background:var(--alap);color:var(--tinta);font:400 17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.doboz{background:var(--lap);border:1px solid var(--vonal);border-radius:12px;padding:16px;display:grid;gap:10px;width:min(520px,100%)}
input{min-height:44px;border-radius:8px;border:1px solid var(--vonal);padding:0 12px;font-size:16px;background:var(--lap);color:var(--tinta)}
button{min-height:44px;border-radius:10px;border:0;background:var(--fut);color:#fff;font-weight:600;font-size:16px}
.halk{color:var(--halk);font-size:14px}
</style>
</head>
<body>
<div id="allapot" class="halk">Betöltés…</div>
<script>
// Betöltő (okt. 22.): a dashboard oldalát mindig a „Stelvio fogadó”-tól kéri (a gép tölti fel oda),
// így a javítások maguktól megjelennek itt is. A legutóbbi változatot a készülék megjegyzi, ezért azonnal nyílik.
var F = 'https://script.google.com/macros/s/AKfycby7Q96vFrG9B0LGjMWPfC2TBTJ0DVBYXY3yWj0lofNfWifKpB419im_tYRepG709ntM/exec';
function t(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
var m = location.hash.match(/^#k=([\w\-]{16,})$/); if (m) t('vfd_kulcs', m[1]);
var k = t('vfd_kulcs'), c = t('vfd_oldal'), mutatva = false;
function mutat(h) { mutatva = true; document.open(); document.write(h); document.close(); }
function kulcsKer(uzenet) {
  document.getElementById('allapot').outerHTML = '<div class="doboz"><b>Add meg a dashboard-kulcsot</b><span class="halk">' + (uzenet || 'Egyszer kell, ez a készülék megjegyzi. Claude-tól kapod.') + '</span>' +
    '<input id="kulcs" autocomplete="off" spellcheck="false" placeholder="kulcs"><button type="button" id="ment">Mentés</button></div>';
  document.getElementById('ment').onclick = function () { t('vfd_kulcs', document.getElementById('kulcs').value.trim()); t('vfd_oldal', ''); location.reload(); };
}
if (!k) kulcsKer();
else {
  if (c) setTimeout(function () { mutat(c); }, 0);
  fetch(F + '?dk=' + encodeURIComponent(k) + '&mit=oldal&x=' + Date.now()).then(function (r) { return r.text(); }).then(function (h) {
    if (!/<html/i.test(h)) { if (!mutatva) kulcsKer('A kulcs nem jó, vagy a szerver nem válaszolt. Próbáld újra.'); return; }
    if (h !== c) { t('vfd_oldal', h); if (mutatva) location.reload(); else mutat(h); }
  }).catch(function () { if (!mutatva) document.getElementById('allapot').textContent = 'Nincs kapcsolat. Próbáld újra kicsit később.'; });
}
</script>
</body>
</html>
